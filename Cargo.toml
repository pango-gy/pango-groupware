[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/db", "crates/server", "crates/web", "xtask"]
default-members = ["crates/core", "crates/api", "crates/db", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/pango-gy/pango-groupware"

[workspace.dependencies]
pango-core = { path = "crates/core" }
pango-api = { path = "crates/api" }
pango-db = { path = "crates/db" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "limit", "catch-panic"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "pango-server"
description = "pango-groupware 서버 (서비스 + HTTP + 실행 파일)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pango-groupware"
path = "src/main.rs"

[dependencies]
pango-core.workspace = true
pango-api.workspace = true
pango-db.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = { workspace = true, features = ["std"] }
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
getrandom.workspace = true
clap.workspace = true
# 외부 알림 웹훅 발송. 리다이렉트는 따라가지 않는다(코드에서 끈다).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
tempfile = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
# 통합 테스트용 도우미(TestApp).
testing = ["pango-db/testing", "dep:tempfile", "dep:sqlx"]

[dev-dependencies]
pango-server = { path = ".", features = ["testing"] }
sqlx.workspace = true

[lints]
workspace = true

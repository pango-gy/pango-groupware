[package]
name = "pango-web"
description = "pango-groupware 웹 UI (Dioxus, WASM). iOS/Android 앱도 같은 코드를 쓴다."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pango-core.workspace = true
pango-api.workspace = true
# devtools(개발 서버 연결)는 쓰지 않으므로 기본 기능에서 뺀다.
dioxus = { version = "0.7", default-features = false, features = ["launch", "logger", "lib", "web", "router"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "NodeList",
    "RequestCredentials",
    "VisibilityState",
    "Window",
] }

[lints]
workspace = true

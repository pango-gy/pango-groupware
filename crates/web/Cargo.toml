[package]
name = "pango-web"
description = "pango-groupware 웹 UI (Dioxus, WASM). iOS/Android 앱도 같은 코드를 쓴다."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pango-core.workspace = true
pango-api.workspace = true
dioxus = { version = "0.7", default-features = false, features = ["web", "router", "macro", "html", "hooks", "signals", "launch"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "RequestCredentials"] }

[lints]
workspace = true
